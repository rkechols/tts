# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  TEXT_DIR: data/text
  TEXT_DIR_CLEANED: data/text-modified
  AUDIO_DIR: data/audio
  VOCAB_FILE: vocabularies/bionicle.yaml

tasks:

  lint:
    desc: Run linters, type-checkers, etc.
    cmds:
      - uvx prek run --all-files  # Includes ruff
      - uv run basedpyright .

  scrape-reset:
    desc: Clears output of task 'scrape' when source code changes
    sources:
      - src/tts/scrape/**/*.py
    cmds:
      - rm -rf {{.TEXT_DIR}}

  scrape:
    desc: Scrape text from internet
    generates:
      - '{{.TEXT_DIR}}/**/*.txt'
    deps:
      - scrape-reset
    cmds:
      - uv run -m tts.scrape.main --out-dir {{.TEXT_DIR}}

  clean_text:
    desc: Run tts.clean_text.main
    sources:
      - src/tts/clean_text/**/*.py
      - '{{.TEXT_DIR}}/**/*.txt'
    generates:
      - '{{.TEXT_DIR_CLEANED}}/**/*.txt'
    cmds:
      - rm -rf {{.TEXT_DIR_CLEANED}}  # This text cleaning is super fast, so it's not worth caching things
      - >-
        uv run -m tts.clean_text.main
        --text-files-dir-in {{.TEXT_DIR}}
        --text-files-dir-out {{.TEXT_DIR_CLEANED}}

  kokoro-reset:
    desc: Clears output of task 'kokoro' when source code changes
    sources:
      - src/tts/kokoro/**/*.py
      - '{{.VOCAB_FILE}}'
    cmds:
      - rm -rf {{.AUDIO_DIR}}

  kokoro:
    desc: Run tts.kokoro.main
    sources:
      - src/tts/kokoro/**/*.py
      - '{{.TEXT_DIR_CLEANED}}/**/*.txt'
      - '{{.VOCAB_FILE}}'
    generates:
      - '{{.AUDIO_DIR}}/**/*.mp3'
    deps:
      - kokoro-reset
    cmds:
      - >-
        uv run -m tts.kokoro.main
        --text-files-dir {{.TEXT_DIR_CLEANED}}
        --audio-files-dir {{.AUDIO_DIR}}
        --vocab {{.VOCAB_FILE}}

  pipeline:
    aliases:
      - run
    desc: Run full pipeline
    cmds:
      - task: scrape
      - task: clean_text
      - task: kokoro
