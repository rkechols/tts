[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[project]
name = "tts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
required-version = ">=0.11.5"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
exclude-newer = "7 days"

[tool.ruff]
# This section ensures that ruff finds the python version declared in this file
extend = "ruff.toml"

[tool.basedpyright]
pythonPlatform = "All"
typeCheckingMode = "recommended"
# Rule adjustments:
reportAny = "hint"
reportUnusedCallResult = false
