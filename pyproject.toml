[build-system]
requires = ["uv_build~=0.11.17"]
build-backend = "uv_build"

[project]
name = "tts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.13.0,<5",
    "cmudict>=1.1.3,<2",
    "en-core-web-sm",
    "kokoro==0.9.4",
    "playwright>=1.60.0,<2",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
    "soundfile~=0.13.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6,<2",
    "pytest>=9.0.3,<10",
]

[tool.uv]
required-version = ">=0.11.5"
exclude-dependencies = [
    "loguru",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
exclude-newer = "7 days"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
# This section ensures that ruff finds the python version declared in this file
extend = "ruff.toml"

[tool.basedpyright]
pythonPlatform = "All"
typeCheckingMode = "recommended"
# Rule adjustments:
reportAny = "hint"
reportMissingParameterType = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnusedCallResult = false
# Bad libs:
allowedUntypedLibraries = [
    "kokoro",
    "misaki",
    "soundfile",
]
